fastapi = ["stacks/fastapi"]
react = ["stacks/react"]
nextjs = ["stacks/nextjs"]
tanstack-query = ["stacks/tanstack-query"]
postgres = ["stacks/postgres"]
vue = ["stacks/vue"]
nuxt = ["stacks/nuxt"]
