vite = ["stacks/vite"]
fsd = ["stacks/fsd"]
java = ["stacks/java"]
spring = ["stacks/spring"]
spring-data-jpa = ["stacks/spring-data-jpa"]
java-spring = ["stacks/java", "stacks/spring", "stacks/spring-data-jpa"]
django = ["stacks/django"]
django-service-layer = ["stacks/layered-architecture", "stacks/backend-layered-architecture", "stacks/django-service-layer"]
django-drf = ["stacks/django-drf"]
django-save-orchestration = ["stacks/django-save-orchestration"]
sqlalchemy = ["stacks/sqlalchemy"]
